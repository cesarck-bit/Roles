<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles de músicos · La Cosecha</title>
  <style>
    :root {
      --fondo: #0d1a2b;
      --tarjeta: #15273d;
      --dorado: #e8a33d;
      --dorado-suave: #f3c77a;
      --texto: #eee8dc;
      --gris: #a9b4c2;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      background: var(--fondo);
      color: var(--texto);
      margin: 0;
      padding: 0 16px 40px;
      min-height: 100vh;
      position: relative;
    }

    /* Imagen de fondo en transparencia: el logo, fijo y centrado */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("logo.jpg") no-repeat center 40% / min(70vw, 520px);
      filter: brightness(0) invert(1);
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }

    header, main {
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 28px 0 8px;
    }
    header img {
      width: 180px;
      max-width: 60%;
      height: auto;
    }
    h1 {
      color: var(--dorado-suave);
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 1px;
      margin: 18px 0 4px;
    }
    .divisor {
      width: 80px;
      height: 3px;
      background: var(--dorado);
      margin: 10px auto 12px;
      border-radius: 2px;
    }
    .mes {
      text-align: center;
      color: var(--gris);
      font-style: italic;
      margin: 0 0 28px;
    }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: rgba(21, 39, 61, 0.92);
      border-radius: 10px;
      padding: 22px 20px;
      border-top: 4px solid var(--dorado);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    /* Domingo más cercano: borde dorado brillante y leve resplandor */
    .card.destacado {
      box-shadow: 0 0 0 2px var(--dorado), 0 6px 22px rgba(232, 163, 61, 0.25);
    }
    .fecha {
      color: var(--dorado);
      font-family: "Arial", sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0 0 14px;
    }
    .badge {
      display: inline-block;
      background: var(--dorado);
      color: #1a1a1a;
      font-size: 0.7rem;
      letter-spacing: 1px;
      padding: 3px 9px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .card p {
      margin: 8px 0;
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .etiqueta {
      color: var(--dorado-suave);
      font-weight: bold;
    }
    .card ol {
      padding-left: 20px;
      margin: 6px 0 14px;
      font-size: 0.95rem;
    }
    .card li {
      margin-bottom: 5px;
      line-height: 1.4;
    }
    .tono {
      color: var(--gris);
      font-size: 0.85rem;
      font-style: italic;
    }
    .btn {
      display: inline-block;
      padding: 9px 16px;
      background: var(--dorado);
      color: #1a1a1a;
      text-decoration: none;
      border-radius: 6px;
      font-family: "Arial", sans-serif;
      font-size: 0.9rem;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--dorado-suave);
    }
    .error {
      text-align: center;
      color: #ff8a80;
    }

    /* Buscador */
    .buscador {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 24px;
      padding: 12px 16px;
      font-size: 1rem;
      font-family: "Arial", sans-serif;
      background: var(--tarjeta);
      color: var(--texto);
      border: 1px solid var(--dorado);
      border-radius: 8px;
    }
    .buscador::placeholder {
      color: var(--gris);
    }
    .sin-resultados {
      text-align: center;
      color: var(--gris);
      font-style: italic;
    }

    /* Botón de WhatsApp */
    .btn-whatsapp {
      margin-left: 6px;
      border: none;
      cursor: pointer;
      background: #25d366;
      color: #fff;
    }
    .btn-whatsapp:hover {
      background: #1ebe5b;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.jpg" alt="La Cosecha Comunidad Cristiana">
    <h1>Roles de músicos</h1>
    <div class="divisor"></div>
    <p class="mes" id="mes"></p>
  </header>

  <main>
    <input type="search" id="buscador" class="buscador" placeholder="Buscar por nombre...">
    <p class="sin-resultados" id="sin-resultados" hidden>No hay domingos con ese nombre.</p>
    <div class="grid" id="grid"></div>
    <p class="error" id="error"></p>
  </main>

  <script>
    // Links publicados de Google Sheets (formato CSV)
    const URL_DOMINGOS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkaOYy27CEINDreY8EPqiA8HFGKRZMHi6PhJkx2SxRAjNgpTNO2eRQ0GSzWqqr1MjbanQGmJTlbea/pub?gid=0&single=true&output=csv";
    const URL_CANCIONES = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVkaOYy27CEINDreY8EPqiA8HFGKRZMHi6PhJkx2SxRAjNgpTNO2eRQ0GSzWqqr1MjbanQGmJTlbea/pub?gid=485661815&single=true&output=csv";

    // Convierte texto CSV en una lista de objetos usando la primera fila como encabezado.
    // Respeta campos entre comillas, como "Luis Mendez, Daniel Alvarado".
    function parsearCSV(texto) {
      const filas = [];
      let fila = [];
      let campo = "";
      let entreComillas = false;

      for (let i = 0; i < texto.length; i++) {
        const c = texto[i];
        if (entreComillas) {
          if (c === '"' && texto[i + 1] === '"') {
            campo += '"';
            i++;
          } else if (c === '"') {
            entreComillas = false;
          } else {
            campo += c;
          }
        } else if (c === '"') {
          entreComillas = true;
        } else if (c === ",") {
          fila.push(campo);
          campo = "";
        } else if (c === "\n") {
          fila.push(campo);
          filas.push(fila);
          fila = [];
          campo = "";
        } else if (c !== "\r") {
          campo += c;
        }
      }
      if (campo !== "" || fila.length > 0) {
        fila.push(campo);
        filas.push(fila);
      }

      const filasConDatos = filas.filter(f => f.some(x => x.trim() !== ""));
      const [encabezados, ...resto] = filasConDatos;
      return resto.map(f => {
        const objeto = {};
        encabezados.forEach((h, i) => {
          objeto[h.trim()] = (f[i] || "").trim();
        });
        return objeto;
      });
    }

    // Convierte "Luis Mendez, Daniel Alvarado" en ["Luis Mendez", "Daniel Alvarado"]
    function separarLista(texto) {
      return texto.split(",").map(x => x.trim()).filter(x => x !== "");
    }

    // Convierte "2026-11-01" en "domingo 1 de noviembre" sin desfase de zona horaria
    function formatearFecha(fechaISO) {
      const fecha = new Date(fechaISO + "T00:00:00");
      return fecha.toLocaleDateString("es-CR", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
    }

    // Fecha de hoy en formato "YYYY-MM-DD", según la hora local del visitante
    function fechaHoy() {
      const ahora = new Date();
      const mes = String(ahora.getMonth() + 1).padStart(2, "0");
      const dia = String(ahora.getDate()).padStart(2, "0");
      return `${ahora.getFullYear()}-${mes}-${dia}`;
    }

    // Arma la lista de domingos uniendo la pestaña Domingos con la de Canciones
    function armarDatos(filasDomingos, filasCanciones) {
      return filasDomingos
        .map(d => ({
          fecha: d.Fecha,
          director: d.Director,
          musicos: separarLista(d.Musicos),
          voces: separarLista(d.Voces),
          playlist: d.Playlist,
          repertorio: filasCanciones
            .filter(c => c.Fecha === d.Fecha)
            .sort((a, b) => Number(a.Orden) - Number(b.Orden))
            .map(c => ({
              orden: Number(c.Orden),
              titulo: c.Titulo,
              autor: c.Autor,
              tono: c.Tono
            }))
        }))
        .sort((a, b) => a.fecha.localeCompare(b.fecha));
    }

    function crearTarjeta(domingo, etiqueta) {
      const card = document.createElement("div");
      card.className = etiqueta ? "card destacado" : "card";

      const badge = etiqueta ? `<span class="badge">${etiqueta}</span>` : "";

      const repertorio = domingo.repertorio
        .map(c => `<li>${c.titulo} <span class="tono">(${c.autor}${c.tono ? " · " + c.tono : ""})</span></li>`)
        .join("");

      const boton = domingo.playlist
        ? `<a class="btn" href="${domingo.playlist}" target="_blank" rel="noopener">Ver playlist</a>`
        : "";

      card.innerHTML = `
        <p class="fecha">${formatearFecha(domingo.fecha)}${badge}</p>
        <p><span class="etiqueta">Director:</span> ${domingo.director}</p>
        <p><span class="etiqueta">Músicos:</span> ${domingo.musicos.join(", ")}</p>
        <p><span class="etiqueta">Voces:</span> ${domingo.voces.join(", ")}</p>
        <p class="etiqueta">Repertorio:</p>
        <ol>${repertorio}</ol>
        ${boton}
        <button class="btn btn-whatsapp">Copiar para WhatsApp</button>
      `;

      card.querySelector(".btn-whatsapp").addEventListener("click", function () {
        copiarResumen(domingo, this);
      });

      return card;
    }

    // Arma el texto con formato de WhatsApp (*negrita* y saltos de línea)
    function construirResumen(domingo) {
      const lineas = [
        `*Roles de músicos · ${formatearFecha(domingo.fecha)}*`,
        "",
        `🎤 *Director:* ${domingo.director}`,
        `🎸 *Músicos:* ${domingo.musicos.join(", ")}`,
        `🎶 *Voces:* ${domingo.voces.join(", ")}`,
        "",
        "📖 *Repertorio:*",
        ...domingo.repertorio.map(c =>
          `${c.orden}. ${c.titulo} (${c.autor}${c.tono ? " · " + c.tono : ""})`
        )
      ];
      return lineas.join("\n");
    }

    // Copia el resumen al portapapeles y avisa en el botón
    async function copiarResumen(domingo, boton) {
      try {
        await navigator.clipboard.writeText(construirResumen(domingo));
        boton.textContent = "¡Copiado!";
      } catch (err) {
        boton.textContent = "No se pudo copiar";
      }
      setTimeout(() => {
        boton.textContent = "Copiar para WhatsApp";
      }, 2000);
    }

    // Buscador: quita acentos y mayúsculas para que "cesar" encuentre "César"
    function normalizar(texto) {
      return texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    document.getElementById("buscador").addEventListener("input", function () {
      const termino = normalizar(this.value.trim());
      const tarjetas = document.querySelectorAll("#grid .card");
      let encontrados = 0;

      tarjetas.forEach(card => {
        const coincide = normalizar(card.textContent).includes(termino);
        card.style.display = coincide ? "" : "none";
        if (coincide) encontrados++;
      });

      document.getElementById("sin-resultados").hidden = encontrados > 0 || termino === "";
    });

    // Carga las dos pestañas de Google Sheets y muestra las tarjetas
    Promise.all([
      fetch(URL_DOMINGOS).then(r => {
        if (!r.ok) throw new Error("No se pudo leer la pestaña Domingos");
        return r.text();
      }),
      fetch(URL_CANCIONES).then(r => {
        if (!r.ok) throw new Error("No se pudo leer la pestaña Canciones");
        return r.text();
      })
    ])
      .then(([textoDomingos, textoCanciones]) => {
        const domingos = armarDatos(parsearCSV(textoDomingos), parsearCSV(textoCanciones));
        const grid = document.getElementById("grid");

        if (domingos.length > 0) {
          const primera = new Date(domingos[0].fecha + "T00:00:00");
          document.getElementById("mes").textContent =
            primera.toLocaleDateString("es-CR", { month: "long", year: "numeric" });
        }

        const hoy = fechaHoy();
        // Primer domingo que es hoy o después
        const proximo = domingos.find(d => d.fecha >= hoy);

        domingos.forEach(domingo => {
          let etiqueta = null;
          if (domingo === proximo) {
            etiqueta = domingo.fecha === hoy ? "Hoy" : "Próximo domingo";
          }
          grid.appendChild(crearTarjeta(domingo, etiqueta));
        });
      })
      .catch(err => {
        document.getElementById("error").textContent =
          "No pude cargar los roles. Revisa que la hoja esté publicada como CSV. (" + err.message + ")";
      });
  </script>

</body>
</html>
