<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles de músicos · La Cosecha</title>
  <style>
    :root {
      --fondo: #0d1a2b;
      --tarjeta: #15273d;
      --dorado: #e8a33d;
      --dorado-suave: #f3c77a;
      --texto: #eee8dc;
      --gris: #a9b4c2;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      background: var(--fondo);
      color: var(--texto);
      margin: 0;
      padding: 0 16px 40px;
      min-height: 100vh;
      position: relative;
    }

    /* Imagen de fondo en transparencia: el logo, fijo y centrado */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("logo.png") no-repeat center 40% / min(70vw, 520px);
      filter: brightness(0) invert(1);
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }

    header, main {
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 28px 0 8px;
    }
    header img {
      width: 180px;
      max-width: 60%;
      height: auto;
    }
    h1 {
      color: var(--dorado-suave);
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 1px;
      margin: 18px 0 4px;
    }
    .divisor {
      width: 80px;
      height: 3px;
      background: var(--dorado);
      margin: 10px auto 12px;
      border-radius: 2px;
    }
    .mes {
      text-align: center;
      color: var(--gris);
      font-style: italic;
      margin: 0 0 28px;
    }

    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: rgba(21, 39, 61, 0.92);
      border-radius: 10px;
      padding: 22px 20px;
      border-top: 4px solid var(--dorado);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    /* Domingo más cercano: borde dorado brillante y leve resplandor */
    .card.destacado {
      box-shadow: 0 0 0 2px var(--dorado), 0 6px 22px rgba(232, 163, 61, 0.25);
    }
    .fecha {
      color: var(--dorado);
      font-family: "Arial", sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0 0 14px;
    }
    .badge {
      display: inline-block;
      background: var(--dorado);
      color: #1a1a1a;
      font-size: 0.7rem;
      letter-spacing: 1px;
      padding: 3px 9px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .card p {
      margin: 8px 0;
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .etiqueta {
      color: var(--dorado-suave);
      font-weight: bold;
    }
    .card ol {
      padding-left: 20px;
      margin: 6px 0 14px;
      font-size: 0.95rem;
    }
    .card li {
      margin-bottom: 5px;
      line-height: 1.4;
    }
    .tono {
      color: var(--gris);
      font-size: 0.85rem;
      font-style: italic;
    }
    .btn {
      display: inline-block;
      padding: 9px 16px;
      background: var(--dorado);
      color: #1a1a1a;
      text-decoration: none;
      border-radius: 6px;
      font-family: "Arial", sans-serif;
      font-size: 0.9rem;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--dorado-suave);
    }
    .error {
      text-align: center;
      color: #ff8a80;
    }

    /* Buscador */    
.buscador {    
  display: block;    
  width: 100%;    
  max-width: 420px;    
  margin: 0 auto 24px;    
  padding: 12px 16px;    
  font-size: 1rem;    
  font-family: "Arial", sans-serif;    
  background: var(--tarjeta);    
  color: var(--texto);    
  border: 1px solid var(--dorado);    
  border-radius: 8px;    
}    
.buscador::placeholder {    
  color: var(--gris);    
}    
.sin-resultados {    
  text-align: center;    
  color: var(--gris);    
  font-style: italic;    
}

  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="La Cosecha Comunidad Cristiana">
    <h1>Roles de músicos</h1>
    <div class="divisor"></div>
    <p class="mes" id="mes"></p>
  </header>

  <main>
    <input type="search" id="buscador" class="buscador" placeholder="Buscar por nombre...">
    <p class="sin-resultados" id="sin-resultados" hidden>No hay domingos con ese nombre.</p>
    <div class="grid" id="grid"></div>
    <p class="error" id="error"></p>
  </main>

  <script>
    // Convierte "2026-11-01" en "domingo 1 de noviembre" sin desfase de zona horaria
    function formatearFecha(fechaISO) {
      const fecha = new Date(fechaISO + "T00:00:00");
      return fecha.toLocaleDateString("es-CR", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });
    }

    // Fecha de hoy en formato "YYYY-MM-DD", según la hora local del visitante
    function fechaHoy() {
      const ahora = new Date();
      const mes = String(ahora.getMonth() + 1).padStart(2, "0");
      const dia = String(ahora.getDate()).padStart(2, "0");
      return `${ahora.getFullYear()}-${mes}-${dia}`;
    }

    function crearTarjeta(domingo, etiqueta) {
      const card = document.createElement("div");
      card.className = etiqueta ? "card destacado" : "card";

      const badge = etiqueta ? `<span class="badge">${etiqueta}</span>` : "";

      const repertorio = domingo.repertorio
        .map(c => `<li>${c.titulo} <span class="tono">(${c.autor}${c.tono ? " · " + c.tono : ""})</span></li>`)
        .join("");

      card.innerHTML = `
        <p class="fecha">${formatearFecha(domingo.fecha)}${badge}</p>
        <p><span class="etiqueta">Director:</span> ${domingo.director}</p>
        <p><span class="etiqueta">Músicos:</span> ${domingo.musicos.join(", ")}</p>
        <p><span class="etiqueta">Voces:</span> ${domingo.voces.join(", ")}</p>
        <p class="etiqueta">Repertorio:</p>
        <ol>${repertorio}</ol>
        <a class="btn" href="${domingo.playlist}" target="_blank" rel="noopener">Ver playlist</a>
      `;
      return card;
    }

    fetch("roles.json")
      .then(respuesta => {
        if (!respuesta.ok) throw new Error("No se pudo cargar roles.json");
        return respuesta.json();
      })
      .then(datos => {
        document.getElementById("mes").textContent = datos.mes;
        const grid = document.getElementById("grid");

        const hoy = fechaHoy();
        // Primer domingo que es hoy o después
        const proximo = datos.domingos.find(d => d.fecha >= hoy);

        datos.domingos.forEach(domingo => {
          let etiqueta = null;
          if (domingo === proximo) {
            etiqueta = domingo.fecha === hoy ? "Hoy" : "Próximo domingo";
          }
          grid.appendChild(crearTarjeta(domingo, etiqueta));
        });
      })
      .catch(err => {
        document.getElementById("error").textContent =
          "No pude cargar los roles. Revisa que roles.json esté en la misma carpeta. (" + err.message + ")";
      });
      // Quita acentos y pasa a minúsculas para que "cesar" encuentre "César"    
function normalizar(texto) {    
  return texto    
    .normalize("NFD")    
    .replace(/[\u0300-\u036f]/g, "")    
    .toLowerCase();    
}    

document.getElementById("buscador").addEventListener("input", function () {    
  const termino = normalizar(this.value.trim());    
  const tarjetas = document.querySelectorAll("#grid .card");    
  let encontrados = 0;    

  tarjetas.forEach(card => {    
    const coincide = normalizar(card.textContent).includes(termino);    
    card.style.display = coincide ? "" : "none";    
    if (coincide) encontrados++;    
  });    

  document.getElementById("sin-resultados").hidden = encontrados > 0 || termino === "";    
});
  </script>

</body>
</html>
